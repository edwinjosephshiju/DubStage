name: Build and Test DubStage

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  python-pipeline:
    name: Python DubForge & Audio Pipeline
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Audio & AI Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install torch numpy soundfile sounddevice yt-dlp demucs

      - name: Syntax & Bytecode Compilation
        run: |
          python -m py_compile dubforge_core.py DubForge.pyw DubStage.pyw dubstage_core.py updater.py

      - name: Test htdemucs_ft & Silero VAD Pipeline
        run: |
          python test_script.py

  android-check:
    name: Android & AI Studio Build Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Validate Gradle Wrapper & Project Structure
        run: |
          echo "Verifying Android Gradle project structure..."
          test -f settings.gradle.kts || exit 1
          test -f build.gradle.kts || exit 1
          test -f app/build.gradle.kts || exit 1
          test -f metadata.json || exit 1
          echo "Project structure verified successfully."
