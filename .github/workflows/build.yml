name: Build and Test DubStage

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  android-check:
    name: Android & AI Studio Build Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Validate Gradle Wrapper & Project Structure
        run: |
          echo "Verifying Android Gradle project structure..."
          test -f settings.gradle.kts || exit 1
          test -f build.gradle.kts || exit 1
          test -f app/build.gradle.kts || exit 1
          test -f metadata.json || exit 1
          test -f app/src/main/cpp/CMakeLists.txt || exit 1
          test -f app/src/main/cpp/demucs_engine.cpp || exit 1
          echo "Project structure verified successfully."
